<title>Solar System Orrery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D sky; an engraved-brass instrument HUD floats on three edges
   (brand + bodies left, live readout right, time bar along the bottom). Single dark theme by choice. */
:root{
  --void:#04060c;
  --panel:rgba(9,13,24,.76);
  --line:rgba(212,173,98,.22);
  --line-strong:rgba(212,173,98,.55);
  --ink:#ece6d8;
  --muted:#a29e90;
  --brass:#d9b267;
  --brass-ink:#1b1408;
  --wash:rgba(212,173,98,.13);
  --warn:#eb9468;
  --f-display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}

/* Scene labels */
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;
  background:none;border:0;padding:3px 5px;cursor:pointer;white-space:nowrap;
  font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);will-change:transform}
.tag::before{content:"";width:12px;height:1px;background:var(--line-strong);flex:none}
.tag:hover,.tag.sel{color:var(--brass)}
.tag.sel::before{background:var(--brass)}
.tag.minor{color:var(--muted);font-size:10px}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,250px) minmax(0,1fr) minmax(0,340px);
  grid-template-rows:auto minmax(0,1fr) auto;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto;min-width:0}

.brand{grid-column:1 / span 2;grid-row:1;justify-self:start;display:grid;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.wordmark{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--brass)}
.date{font-family:var(--f-display);font-size:clamp(26px,3.4vw,38px);line-height:1.05;font-weight:400;letter-spacing:.02em}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:2px 8px}
.paint{color:var(--brass)}
.hint-touch{display:none}
@media (hover:none){.hint-mouse{display:none}.hint-touch{display:inline}}

.bodies{grid-column:1;grid-row:2;align-self:start;justify-self:start;display:flex;flex-direction:column;gap:1px;
  padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.body-btn{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:6px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:13px;font-weight:500}
.body-btn:hover{background:rgba(236,230,216,.06)}
.body-btn[aria-current="true"]{background:var(--wash)}
.body-btn[aria-current="true"] .nm{color:var(--brass)}
.body-btn.sub{padding-left:26px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset -2px -2px 3px rgba(0,0,0,.45)}
.sub .dot{width:7px;height:7px;justify-self:center}
.au{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.key{font-family:var(--f-mono);font-size:10px;color:var(--muted);opacity:.7;margin-left:4px}

.info{grid-column:3;grid-row:1 / span 2;align-self:start;max-height:100%;overflow:auto;overscroll-behavior:contain;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.info-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.info h2{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:.03em;color:var(--brass);text-wrap:balance}
.info-body{display:grid;gap:16px;margin-top:12px}
.blurb{margin:0;font-size:14px;line-height:1.5;color:var(--ink);max-width:62ch}
.info h3{margin:0 0 8px;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);
  display:flex;align-items:center;gap:10px}
.info h3::after{content:"";flex:1;height:1px;background:var(--line)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px rgba(217,178,103,.2);flex:none}
dl{margin:0;display:grid;gap:8px}
dl > div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;align-items:baseline}
dt{font-size:12px;color:var(--muted)}
dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;overflow-wrap:anywhere}
.progress{display:grid;gap:6px}
.track{position:relative;height:6px;border-radius:3px;background:rgba(236,230,216,.08);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,rgba(217,178,103,.35),var(--brass));border-radius:3px}
.progress-text{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn svg{width:16px;height:16px;fill:currentColor}
.icon-btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.icon-btn[aria-pressed="true"]{color:var(--brass);border-color:var(--line-strong)}
#i-collapse{width:30px;height:30px}
#i-collapse svg{transition:transform .2s}
#i-collapse[aria-expanded="false"] svg{transform:rotate(180deg)}

.controls{grid-column:1 / -1;grid-row:3;justify-self:center;max-width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;
  padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.grp{display:flex;align-items:center;gap:4px}
.grp + .grp{padding-left:14px;border-left:1px solid var(--line)}
.chip{font-size:12px;font-weight:500;line-height:1;padding:8px 10px;border-radius:999px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip:hover{border-color:var(--line)}
.chip[aria-checked="true"]{background:var(--brass);color:var(--brass-ink)}
.chip.toggle{color:var(--muted);border-color:var(--line)}
.chip.toggle[aria-pressed="true"]{color:var(--brass);border-color:var(--line-strong)}
.per{font-size:11px;color:var(--muted);margin-left:4px;white-space:nowrap}
#d-input{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color-scheme:dark;min-width:0}

@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:10px}
  .brand{grid-column:1;grid-row:1}
  .bodies{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;max-width:100%;justify-self:stretch;scrollbar-width:none;padding:4px}
  .bodies::-webkit-scrollbar{display:none}
  .body-btn{grid-template-columns:8px auto;gap:7px;padding:6px 10px;white-space:nowrap;font-size:12px}
  .body-btn.sub{padding-left:10px}
  .au,.key{display:none}
  .info{grid-column:1;grid-row:4;align-self:end;max-height:36vh;padding:12px 14px}
  .info h2{font-size:22px}
  .controls{grid-column:1;grid-row:5;justify-self:stretch;gap:6px 8px;padding:8px;border-radius:16px}
  .grp + .grp{padding-left:8px}
  .grp.view{border-left:0;padding-left:0}
  .per{display:none}
  .chip{padding:7px 8px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){#i-collapse svg{transition:none}}
</style>

<div id="app">
  <canvas id="gl" aria-label="Interactive 3D view of the solar system. Drag to orbit, scroll or pinch to zoom, click a planet to focus it."></canvas>
  <div class="labels" id="labels"></div>

  <div class="hud">
    <header class="brand">
      <div class="wordmark">Solar System Orrery</div>
      <div class="date" id="h-date">—</div>
      <div class="meta"><span id="h-time">—</span><span id="h-jd">—</span></div>
      <div class="note">
        <span id="h-scale">Distances compressed, sizes enlarged</span>
        <span class="pill" id="h-acc" hidden>Low accuracy outside 1800–2050</span>
        <span class="paint" id="h-paint">Painting planet surfaces…</span>
      </div>
      <div class="note hint"><span class="hint-mouse">Drag to orbit · scroll to zoom · click a world</span><span class="hint-touch">Drag to orbit · pinch to zoom · tap a world</span></div>
    </header>

    <nav class="bodies" id="bodies" aria-label="Bodies"></nav>

    <aside class="info" id="info" aria-labelledby="i-name">
      <div class="info-head">
        <div>
          <div class="eyebrow" id="i-type"></div>
          <h2 id="i-name"></h2>
        </div>
        <button class="icon-btn" id="i-collapse" aria-expanded="true" aria-controls="i-body" aria-label="Hide details">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 10.7 8 6l4.7 4.7-1.1 1.1L8 8.2l-3.6 3.6z"/></svg>
        </button>
      </div>
      <div class="info-body" id="i-body">
        <p class="blurb" id="i-blurb"></p>
        <section>
          <h3><span class="live-dot" aria-hidden="true"></span>On this date</h3>
          <dl id="i-live"></dl>
        </section>
        <section class="progress" id="i-progress">
          <h3>Orbit</h3>
          <div class="track" aria-hidden="true"><div class="fill" id="i-fill"></div></div>
          <div class="progress-text"><span id="i-prog-a"></span><span id="i-prog-b"></span></div>
        </section>
        <section>
          <h3>Vital statistics</h3>
          <dl id="i-facts"></dl>
        </section>
      </div>
    </aside>

    <div class="controls" role="toolbar" aria-label="Time and view">
      <div class="grp">
        <button class="icon-btn" id="b-rev" aria-pressed="false" aria-label="Run time backwards" title="Run backwards (R)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 3.5v9L1.5 8zM14.5 3.5v9l-6-4.5z"/></svg>
        </button>
        <button class="icon-btn primary" id="b-play" aria-label="Pause" title="Play / pause (Space)">
          <svg viewBox="0 0 16 16" aria-hidden="true" id="play-icon"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
        </button>
      </div>
      <div class="grp" role="radiogroup" aria-label="Simulation speed" id="speeds"></div>
      <div class="grp">
        <button class="chip toggle" id="b-today">Today</button>
        <input type="date" id="d-input" aria-label="Jump to date" min="1600-01-01" max="2399-12-31">
      </div>
      <div class="grp view">
        <button class="chip toggle" id="t-orbits" aria-pressed="true">Orbits</button>
        <button class="chip toggle" id="t-labels" aria-pressed="true">Labels</button>
        <button class="chip toggle" id="t-scale" aria-pressed="false">True distances</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  for(let i=0;i<512;i++) p[i]=a[i&255];

    const u=fx*fx*(3-2*fx), w=fy*fy*(3-2*fy), s=fz*fz*(3-2*fz);

  const ex=Math.cos(beta)*Math.cos(lam), ey=Math.cos(beta)*Math.sin(lam), ez=Math.sin(beta);
  return new THREE.Quaternion().setFromUnitVectors(UP,new THREE.Vector3(ex,ez,-ey).normalize());
}
const sunWorld=new THREE.Vector3(0,0,0);
function atmosphere(radius,color,strength){
  const m=new THREE.ShaderMaterial({extensions:{fragDepth:true},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{c:{value:new THREE.Color(color)},s:{value:strength},sun:{value:sunWorld}},
    vertexShader:`varying vec3 vN;varying vec3 vV;varying vec3 vWN;varying vec3 vWP;
      #include <common>
      #include <logdepthbuf_pars_vertex>
      void main(){vN=normalize(normalMatrix*normal);vec4 wp=modelMatrix*vec4(position,1.);vWP=wp.xyz;vWN=normalize(mat3(modelMatrix)*normal);vec4 mv=viewMatrix*wp;vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;
      #include <logdepthbuf_vertex>
      }`,
    fragmentShader:`uniform vec3 c;uniform float s;uniform vec3 sun;varying vec3 vN;varying vec3 vV;varying vec3 vWN;varying vec3 vWP;
      #include <logdepthbuf_pars_fragment>
      void main(){
      #include <logdepthbuf_fragment>
      float f=pow(1.-max(dot(normalize(vN),normalize(vV)),0.),2.6);float l=smoothstep(-.25,.5,dot(normalize(vWN),normalize(sun-vWP)));gl_FragColor=vec4(c*f*l*s,1.);}`});
  return new THREE.Mesh(new THREE.SphereGeometry(radius,48,32),m);
}
function ringMesh(inner,outer,canvas,opacity){
  const g=new THREE.RingGeometry(inner,outer,180,1), p=g.attributes.position, uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){ const r=Math.hypot(p.getX(i),p.getY(i)); uv.setXY(i,(r-inner)/(outer-inner),.5); }
  const m=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(canvas),color:0xd8d2c6,transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity});
  const mesh=new THREE.Mesh(g,m); mesh.rotation.x=-Math.PI/2; return mesh;
}

const cam={theta:-.65,phi:1.02,dist:140,target:new THREE.Vector3()};
const focus={t:1,from:new THREE.Vector3(),fromDist:140,toDist:140,distAnim:false};
const pointers=new Map(); let dragMoved=0, pinchPrev=0;
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragMoved=0; if(pointers.size===2) pinchPrev=pinchDist(); canvas.classList.add('dragging'); });
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(pointers.size===1){ dragMoved+=Math.abs(dx)+Math.abs(dy); cam.theta-=dx*.0055; cam.phi=clamp(cam.phi-dy*.0055,.06,Math.PI-.06); }
  else if(pointers.size===2){ const d=pinchDist(); if(pinchPrev>0) zoomBy(pinchPrev/d); pinchPrev=d; dragMoved+=10; }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  const single=pointers.size===1; pointers.delete(e.pointerId);
  if(pointers.size<2) pinchPrev=0;
  if(!pointers.size) canvas.classList.remove('dragging');
  if(single && e.type==='pointerup' && dragMoved<6) pick(e);
}
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomBy(Math.exp(clamp(e.deltaY,-120,120)*.0015)); },{passive:false});
function pinchDist(){ const [a,b]=[...pointers.values()]; return Math.hypot(a.x-b.x,a.y-b.y)||1; }
function zoomBy(k){ focus.distAnim=false; cam.dist=clamp(cam.dist*k, minDist(), 8000); }

function pick(e){
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);

}

const PHASES=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];

/* ---------- Frame loop ---------- */
const tmp=new THREE.Vector3(), proj=new THREE.Vector3();
let last=performance.now(), infoClock=0, lastScaleE=-1;
function resize(){
  const w=app.clientWidth, h=app.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
function frame(now){
  const dt=Math.min((now-last)/1000,.1); last=now;
  const dDays = state.playing ? SPEEDS[state.speedIdx].d*state.dir*dt : 0;
  state.jd=clamp(state.jd+dDays, JD_MIN, JD_MAX);
  if(state.jd===JD_MIN||state.jd===JD_MAX) if(state.playing && ((state.dir<0&&state.jd===JD_MIN)||(state.dir>0&&state.jd===JD_MAX))) setPlaying(false);
  const T=(state.jd-J2000)/36525;

  // scale blend
  const tgt=state.scale; if(state.scaleE!==tgt){ const step=dt*.8; state.scaleE = Math.abs(tgt-state.scaleE)<step ? tgt : state.scaleE+Math.sign(tgt-state.scaleE)*step; }
  const se=state.scaleE; state.scaleE=ease(se);
  // orbits
  const orbitStale = orbitT===null || Math.abs(T-orbitT)>.05;
  if(orbitStale){ orbitT=T; PLANETS.forEach(b=>orbitAU(b.el,T,ORBIT_N,b.orbitAU)); }
  if(orbitStale || se!==lastScaleE){
    PLANETS.forEach(b=>{ const a=b.orbit.geometry.attributes.position, s=a.array, o=b.orbitAU;
      for(let i=0;i<ORBIT_N;i++){ toScene(o[i*3],o[i*3+1],o[i*3+2],tmp); s[i*3]=tmp.x; s[i*3+1]=tmp.y; s[i*3+2]=tmp.z; }
      a.needsUpdate=true; b.orbit.geometry.computeBoundingSphere(); });
  }
  // bodies
  PLANETS.forEach(b=>{ kepler(b.el,T,b.au); toScene(b.au.x,b.au.y,b.au.z,b.pos); b.anchor.position.copy(b.pos); });
  { const m=moonGeo(state.jd), e=byId.earth, cl=Math.cos(m.lat);
    byId.moon.pos.set(cl*Math.cos(m.lon), Math.sin(m.lat), -cl*Math.sin(m.lon)).multiplyScalar(MOON_OFFSET).add(e.pos);
    byId.moon.mesh.position.copy(byId.moon.pos); byId.moon.mesh.lookAt(e.pos); }
  // belt
  { const a=beltGeo.attributes.position, s=a.array, t=state.jd-J2000;
    for(let i=0;i<BELT_N;i++){ const ang=belt.ph[i]+belt.n[i]*t, r=belt.a[i];
      toScene(r*Math.cos(ang), r*Math.sin(ang), r*belt.inc[i]*Math.sin(ang-belt.node[i]), tmp); s[i*3]=tmp.x; s[i*3+1]=tmp.y; s[i*3+2]=tmp.z; }
    a.needsUpdate=true; }
  lastScaleE=se; state.scaleE=se;
  // spin (capped so fast time doesn't strobe)
  BODIES.forEach(b=>{ if(!b.spin||!b.rot) return; const inc=dDays*TAU/b.rot; b.spin.rotation.y += clamp(inc,-.07,.07); });
  if(byId.earth.clouds) byId.earth.clouds.rotation.y += clamp(dDays*TAU/0.9,-.075,.075);

  // camera follow
  const sel=byId[state.sel];
  if(focus.t<1){
    focus.t=Math.min(1,focus.t+dt/1.5); const k=ease(focus.t);
    cam.target.lerpVectors(focus.from,sel.pos,k);
    if(focus.distAnim) cam.dist=Math.exp(lerp(Math.log(focus.fromDist),Math.log(focus.toDist),k));
  } else cam.target.copy(sel.pos);
  cam.dist=Math.max(cam.dist,minDist());
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.dist*sp*Math.sin(cam.theta), cam.target.y+cam.dist*Math.cos(cam.phi), cam.target.z+cam.dist*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();

  // labels
  if(state.labels){
    const W=app.clientWidth, H=app.clientHeight, f=H/2/Math.tan(camera.fov*DEG/2);
    const earthD=camera.position.distanceTo(byId.earth.pos), moonOrbitPx=MOON_OFFSET/earthD*f;
    const placed=[];
    LABEL_ORDER.slice().sort((a,b)=>(b.id===state.sel)-(a.id===state.sel)).forEach(b=>{
      proj.copy(b.pos).project(camera);
      const d=camera.position.distanceTo(b.pos), rpx=b.size/d*f;
      let show = proj.z<1 && proj.z>-1 && Math.abs(proj.x)<1.2 && Math.abs(proj.y)<1.2;
      if(b.id==='moon') show = show && moonOrbitPx>34;
      if(b.id===state.sel && rpx>H*.18) show=false;
      const x=(proj.x*.5+.5)*W+Math.min(rpx,H*.2)+2, y=(-proj.y*.5+.5)*H;
      if(show){
        if(!b.tagW && b.tagShown) b.tagW=b.tag.offsetWidth;
        const w=b.tagW||b.name.length*9+30, r=[x,y-9,x+w,y+9];
        if(placed.some(q=>r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1])) show=false; else placed.push(r);
      }
      if(show!==b.tagShown){ b.tag.hidden=!show; b.tagShown=show; }
      if(show) b.tag.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translateY(-50%)`;
    });
  }
  infoClock+=dt; if(infoClock>.12){ infoClock=0; updateInfo(); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- Boot (keeps place across live updates) ---------- */
function boot(data){
  data=data||{};
  if(typeof data.jd==='number') state.jd=clamp(data.jd,JD_MIN,JD_MAX);
  ['playing','speedIdx','dir','orbits','labels'].forEach(k=>{ if(data[k]!==undefined) state[k]=data[k]; });
  if(data.scale!==undefined){ state.scale=data.scale; state.scaleE=data.scale; }
  if(data.cam){ Object.assign(cam,{theta:data.cam.theta,phi:data.cam.phi}); }
  resize();
  syncControls();
  select(byId[data.sel]?data.sel:'sun');
  focus.t=.999; cam.dist=data.cam&&data.cam.dist?data.cam.dist:focus.toDist;
  requestAnimationFrame(t=>{ last=t; frame(t); });
  setTimeout(runJobs,30);
}
const hot=window.claude&&window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>({jd:state.jd,sel:state.sel,playing:state.playing,speedIdx:state.speedIdx,dir:state.dir,orbits:state.orbits,labels:state.labels,scale:state.scale,cam:{theta:cam.theta,phi:cam.phi,dist:cam.dist}}));
if(hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});
})();
</script>
